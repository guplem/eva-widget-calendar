<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar</title>
    <!-- Eva answers this path with her colours. The widget works without it too. -->
    <link rel="stylesheet" href="eva/theme.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="widget" data-size="xlarge" data-state="loading">
      <header class="widget-header">
        <h1 class="widget-title">Calendar</h1>
        <p class="widget-range" data-role="range"></p>
        <p class="hidden-note" data-role="hidden"></p>
      </header>
      <section class="view" data-role="view"></section>
      <div class="message" data-role="off">
        <p class="message-title">Eva cannot read your Google Calendar yet.</p>
        <p>In Eva, open Settings &gt; Connections &gt; Google. Log in to Google, and tick Calendar.</p>
      </div>
      <p class="message" data-role="message"></p>
    </main>
  </body>
</html>
